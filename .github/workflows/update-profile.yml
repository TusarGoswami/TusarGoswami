name: Update Profile Card

# Runs hourly at :17 to avoid peak-minute congestion.
# Also allows manual trigger via workflow_dispatch.
# Does NOT trigger on push — prevents infinite commit loops.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the updated SVG

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install needed — script uses only Python standard library

      - name: Generate profile SVG
        run: python scripts/generate_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🔄 Update profile card [skip ci]"
            git push
          fi
